# SourceSpec 1.8 configuration for the Vrancea Mw catalogue.
#
# Spectra extend below 0.5 Hz on broadband and accelerometer channels so the
# low-frequency plateau of M >= 4.5 events is resolved; t* is bounded to
# 0.005-0.15 s, fc to 0.05-40 Hz, and spectral S/N is measured from 0.1 Hz.
# Per-event overrides (win_length, freq1_*, bp_freqmin_*, ignore_traceids,
# clipping) are appended by run_sourcespec.py from the catalogue ML; the values
# below are the defaults, which apply to small events.

author_name = ROMPLUS_mw
agency_short_name = NIEP_local
agency_full_name = NIEP Romania local reanalysis

# --- station selection ---
epi_dist_ranges = 0, 300

# --- instrument handling ---
correct_instrumental_response = True
trace_units = auto
ignore_vertical = False

# --- time windows (seconds) ---
wave_type = S
# Minimum S-window length (floor). Actual per-trace length comes from the
# RED-PAN-Motion S-P + amplitude-decay rule in source_spec_redpan_windows.py
win_length = 5.0
signal_pre_time = 1.0
# Placeholder: source_spec_redpan_windows.py resets the noise window to the
# signal-window length, ending at P - signal_pre_time
noise_pre_time = 6.0
p_arrival_tolerance = 4.0
s_arrival_tolerance = 4.0

# --- filtering / spectral band ---
bp_freqmin_broadb = 0.25
bp_freqmax_broadb = 40.0
bp_freqmin_shortp = 1.0
bp_freqmax_shortp = 40.0
bp_freqmin_disp   = 0.25
bp_freqmax_disp   = 40.0
bp_freqmin_acc    = 0.25
bp_freqmax_acc    = 45.0

freq1_broadb = 0.5
freq2_broadb = 35.0
freq1_shortp = 1.0
freq2_shortp = 35.0
freq1_acc    = 0.5
freq2_acc    = 40.0
freq1_disp   = 0.5
freq2_disp   = 35.0

spectral_smooth_width_decades = 0.2

# --- source velocity + density (Koulakov Vrancea 1D, layered) ---
vp_source = 5.5, 5.68, 6.18, 6.67, 7.02, 7.89, 8.29, 8.32
vs_source = 3.2, 3.20, 3.63, 3.72, 3.98, 4.54, 4.76, 4.83
layer_top_depths = 0, 10, 20, 30, 40, 50, 60, 70
rho_source = 2500, 2600, 2700, 2800, 2900, 3100, 3300, 3300

# --- geometrical spreading ---
# Body-wave 1/r (hypocentral). No empirical depth or site term is applied;
# any residual regime dependence is tested in the calibration step.
geom_spread_model = r_power_n
geom_spread_n_exponent = 1.0

# --- radiation pattern (average) ---
rpp = 0.52
rps = 0.62

# --- inversion ---
inv_algorithm = TNC
# wider Mw search around the spectral plateau (up to 36 % of small-event
# station fits sat at the default 0.1 bound in the pilot)
Mw_0_variability = 0.3
t_star_min_max = 0.005, 0.15
fc_min_max = 0.05, 40.0
weighting = noise
f_weight = 7.0
weight = 10.0

# --- QC ---
# Clipping detection stays on for large events; run_sourcespec.py turns it
# off for small events, where microseism-dominated raw counts are misflagged.
clipping_detection_algorithm = clipping_score
rmsmin = 0.0
sn_min = 1.5
spectral_sn_min = 1.5
spectral_sn_freq_range = 0.1, 20.0

# --- bulk mode ---
plot_save = False
save_spectra = False
html_report = False
